<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>GRAYZONE PROTOCOL</title>
    <!--
      viewport-fit=cover lets the layout extend under a notch; the CSS then
      pads with env(safe-area-inset-*). user-scalable=no is essential: a
      pinch-zoom during a firefight is unrecoverable.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Mobiler PvE-Extraction-Shooter - technischer Prototyp." />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="Grayzone" />
    <!--
      Installing to the home screen is not a nicety on this game, it is the
      only way to get the browser chrome out of the way on iPhone: Safari has
      no fullscreen API there, and its toolbars cost roughly 15 % of a
      landscape viewport that is already short.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Inline favicon: keeps the build asset-free and the console clean. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d10'/%3E%3Cpath d='M6 22 L16 7 L26 22 Z' fill='none' stroke='%23c8913a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='18' r='2.5' fill='%23c8913a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
